<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121820"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="1010" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E7C66" stop-opacity="0.55"/><stop offset="1" stop-color="#0E7C66" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="icon"><rect x="80" y="96" width="96" height="96" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="860" y="-67" width="300" height="667" rx="26"/></clipPath>
    <style>
      text { font-family: Inter, 'DejaVu Sans', sans-serif; }
      .name { font-size: 64px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
      .title { font-size: 50px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
      .acc { fill: #2fd3a8; }
      .sub { font-size: 26px; font-weight: 500; fill: #a9b4c2; }
      .tag { font-size: 22px; font-weight: 600; fill: #a9b4c2; }
      .pill { font-size: 22px; font-weight: 700; fill: #0b0d10; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <image x="80" y="96" width="96" height="96" clip-path="url(#icon)" xlink:href="../../app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"/>
  <text class="name" x="196" y="166">TapOver</text>

  <text class="title"><tspan x="80" y="290">Put a tap target on top</tspan><tspan x="80" y="352">of <tspan class="acc">any Android app</tspan></tspan></text>
  <text class="sub"><tspan x="80" y="420">Tap it to open another app, or the newest</tspan><tspan x="80" y="456">photo or video in a folder.</tspan></text>

  <g class="tag">
    <rect x="80" y="506" width="150" height="44" rx="22" fill="none" stroke="#39404b" stroke-width="2"/>
    <text class="tag" x="155" y="535" text-anchor="middle">Android 10+</text>
    <rect x="246" y="506" width="156" height="44" rx="22" fill="none" stroke="#39404b" stroke-width="2"/>
    <text class="tag" x="324" y="535" text-anchor="middle">Open source</text>
    <rect x="418" y="506" width="120" height="44" rx="22" fill="none" stroke="#39404b" stroke-width="2"/>
    <text class="tag" x="478" y="535" text-anchor="middle">No ads</text>
  </g>

  <rect x="850" y="-77" width="320" height="687" rx="36" fill="#0b0c0f" stroke="#39404b" stroke-width="3"/>
  <image x="860" y="-67" width="300" height="667" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)" xlink:href="screenshots/src/camera-tapover.jpg"/>
  <g>
    <circle cx="920" cy="432" r="34" fill="none" stroke="#2fd3a8" stroke-width="12" opacity="0.25"/>
    <circle cx="920" cy="432" r="34" fill="none" stroke="#2fd3a8" stroke-width="4"/>
    <path d="M 886 432 L 826 432" stroke="#2fd3a8" stroke-width="4" stroke-linecap="round"/>
    <rect x="706" y="412" width="120" height="40" rx="20" fill="#2fd3a8"/>
    <text class="pill" x="766" y="440">TapOver</text>
  </g>
</svg>
